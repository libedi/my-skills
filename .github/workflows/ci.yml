name: validate skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_portability.py
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python -m unittest discover -s skills/research/scripts -p 'test_*.py'
      - run: python -m unittest discover -s skills/research/adapters/claude/scripts -p 'test_*.py'
